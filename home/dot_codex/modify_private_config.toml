{{- /* chezmoi:modify-template */ -}}
{{- $managed := `
approvals_reviewer = "auto_review"

[agents]
max_concurrent_threads_per_session = 20

[tui]
terminal_title = ["spinner", "thread"]
status_line = [
  "model-with-reasoning",
  "fast-mode",
  "approval-mode",
  "git-branch",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
  "current-dir",
]

[notice]
hide_full_access_warning = true
` | fromToml -}}
{{- includeTemplate "merge-settings.tmpl" (dict "managed" $managed "stdin" .chezmoi.stdin "format" "toml") -}}
